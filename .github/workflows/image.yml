# SPEC-PLAT-06 R79 (services only): every push to main builds the service image with Jib (distroless Java 21,
# non-root) and pushes it to GHCR as :<project version>, :sha-<commit> and :latest. Configuration is environment-only.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write          # push to ghcr.io/<owner>/<service>; read the platform libraries
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build and push the image (tests ran in ci)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          mvn -B -ntp package -DskipTests com.google.cloud.tools:jib-maven-plugin:build \
            -Djib.to.auth.username="${{ github.actor }}" -Djib.to.auth.password="$GITHUB_TOKEN" \
            -Djib.to.tags="sha-${SHA::12},latest"
