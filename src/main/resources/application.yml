# SPEC-PLAT-06 R76/R77 (ADR-017): environment-specific values come ONLY from the environment; the service refuses to
# start naming every missing variable (gc.required-properties). Variables: .env.example.
gc.required-properties: >-
  spring.datasource.url, spring.datasource.username, spring.datasource.password,
  spring.security.oauth2.resourceserver.jwt.issuer-uri, spring.security.oauth2.resourceserver.jwt.jwk-set-uri,
  gc.security.internal-clients, spring.kafka.bootstrap-servers, gc.grower.base-url, gc.iam.base-url,
  spring.security.oauth2.client.registration.notification-service.client-id,
  spring.security.oauth2.client.registration.notification-service.client-secret,
  spring.security.oauth2.client.provider.keycloak.token-uri, gc.case-notices.grower-app-url, gc.case-notices.staff-app-url

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  flyway:
    enabled: ${GC_MIGRATE:false}
    user: ${DB_OWNER_USER:}
    password: ${DB_OWNER_PASSWORD:}
    schemas: notify
    default-schema: notify
    create-schemas: true
    locations: classpath:db/migration
    placeholders:
      app_role: ${spring.datasource.username}

springdoc:
  api-docs:
    enabled: ${GC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${GC_API_DOCS_ENABLED:false}
  paths-to-exclude: /dev/**                   # SPEC-NOT-01 §3: the dev mailbox is not part of the contract

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# ---------------------------------------------------------------- security: service clients only (SPEC-NOT-01 R7)
spring.security.oauth2.resourceserver.jwt:
  issuer-uri: ${OIDC_ISSUER_URI}
  jwk-set-uri: ${OIDC_JWKS_URI}
  audiences: gc-api,gc-internal
gc.security:
  internal-clients: ${GC_INTERNAL_CLIENTS}
  cors-allowed-origins: ${GC_CORS_ALLOWED_ORIGINS:}

# ---------------------------------------------------------------- providers (SPEC-NOT-01 D2, D3)
# Local: GC_DEV_MAILBOX=true and every provider "mailbox" (messages are stored, not sent). The mailbox can never be
# combined with a real provider; real providers are later adapters behind the same ports.
gc.notification:
  dev-mailbox: ${GC_DEV_MAILBOX:false}
  sms-provider: ${GC_SMS_PROVIDER:}
  whatsapp-provider: ${GC_WHATSAPP_PROVIDER:}
  email-provider: ${GC_EMAIL_PROVIDER:}

# ---------------------------------------------------------------- case notifications (SPEC-NOT-02)
spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  consumer:
    auto-offset-reset: earliest
    enable-auto-commit: false
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  producer:   # DLQ only
    acks: all
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.apache.kafka.common.serialization.StringSerializer

gc.events:
  consumers-enabled: ${GC_EVENTS_CONSUMERS_ENABLED:true}
  case-topic: case.case.events
  retry-initial-backoff: 1s

# D4: contacts are read at send time with notification-service's own client-credentials token (audience gc-internal).
spring.security.oauth2.client:
  registration:
    notification-service:
      provider: keycloak
      client-id: ${SERVICE_CLIENT_ID}
      client-secret: ${SERVICE_CLIENT_SECRET}
      authorization-grant-type: client_credentials
  provider:
    keycloak:
      token-uri: ${OIDC_TOKEN_URI}

# Other services, reached only over the network (SPEC-PLAT-06 R75).
gc.grower:
  base-url: ${GROWER_BASE_URL}
gc.iam:
  base-url: ${IAM_BASE_URL}

gc.case-notices:
  grower-app-url: ${GC_GROWER_APP_URL}          # D7: messages link to GC_GROWER_APP_URL/cases/{id}
  staff-app-url: ${GC_STAFF_APP_URL}            # the assignment email links to the staff console
  release-enabled: ${GC_CASE_NOTICE_RELEASE_ENABLED:true}
  release-interval-ms: ${GC_CASE_NOTICE_RELEASE_INTERVAL_MS:15000}
  window: ${GC_CASE_NOTICE_WINDOW:PT5M}                 # D9: the spec's 5 minutes; the local stack shortens it
  quiet-hours: ${GC_CASE_NOTICE_QUIET_HOURS:true}       # D9: 21:00-07:00 country time; the local stack switches it off
